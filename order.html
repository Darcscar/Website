<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Order Online | Pedro's Classic & Asian Cuisine</title>
    <meta name="description" content="Order your favorite Pedro's dishes online for pickup or delivery." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-red: #C41E3A;
            --dark-red: #8B0000;
            --gold: #D4AF37;
            --light-gold: #F4E4BC;
            --charcoal: #2C2C2C;
            --dark-bg: #1a1a1a;
            --cream: #FFF8F0;
            --text-dark: #333333;
            --text-light: #F5F5F5;
            --border: #E8DCC8;
        }

        html, body { height: 100%; }
        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            background: var(--cream);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100dvh;
        }

        /* ── Header ─────────────────────────────────────── */
        .topbar {
            flex-shrink: 0;
            background: var(--dark-bg);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
            z-index: 20;
        }
        .topbar .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--gold);
            text-decoration: none;
        }
        .topbar a.back {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.8rem;
            opacity: 0.85;
        }
        .topbar a.back:hover { opacity: 1; }

        /* ── Scroll area ────────────────────────────────── */
        #scroller {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .wrap { max-width: 860px; margin: 0 auto; padding: 18px 16px 120px; }

        /* ── Search + chips ─────────────────────────────── */
        .search {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font: inherit;
            font-size: 0.9rem;
            background: #fff;
            outline: none;
            margin-bottom: 12px;
        }
        .search:focus { border-color: var(--gold); }
        .chipsbar {
            position: sticky;
            top: 0;
            z-index: 25;
            background: var(--cream);
            margin: 0 -16px;
            padding: 8px 16px 6px;
            box-shadow: 0 6px 12px -8px rgba(0,0,0,0.15);
        }
        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .chips::-webkit-scrollbar { display: none; }
        .cat-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--charcoal);
            margin: 2px;
        }
        .cat-head {
            display: flex; align-items: center; gap: 10px;
            margin: 4px 0 12px;
        }
        .cat-back {
            background: #fff; border: 1px solid var(--border);
            border-radius: 999px; padding: 8px 14px;
            font: inherit; font-size: 0.8rem; font-weight: 600;
            color: var(--text-dark); cursor: pointer; white-space: nowrap;
        }
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 14px;
        }
        @media (min-width: 640px) { .cat-grid { grid-template-columns: repeat(3, 1fr); } }
        .cat-tile {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16 / 10;
            cursor: pointer;
            background: var(--charcoal);
            border: none;
            padding: 0;
            text-align: left;
            width: 100%;
        }
        .cat-tile img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }
        .cat-tile .shade {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.72));
        }
        .cat-tile .tlabel {
            position: absolute; left: 12px; right: 12px; bottom: 10px;
            color: #fff;
        }
        .cat-tile .tname {
            font-family: 'Playfair Display', serif;
            font-weight: 700; font-size: 1rem; line-height: 1.2;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
        }
        .cat-tile .tcount {
            font-size: 0.68rem; opacity: 0.85; font-weight: 500;
        }
        .cat-select {
            display: flex; align-items: center; gap: 8px;
            background: var(--charcoal); color: #fff;
            border: none; border-radius: 999px;
            padding: 9px 16px;
            font: inherit; font-size: 0.88rem; font-weight: 600;
            cursor: pointer;
            max-width: 100%;
        }
        .cat-select .caret { color: var(--gold); font-size: 0.7rem; }
        .cat-select .cname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .prow {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%;
            background: var(--cream);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 14px;
            margin-bottom: 8px;
            font: inherit; font-size: 0.9rem; font-weight: 600;
            color: var(--text-dark);
            cursor: pointer; text-align: left;
        }
        .prow.current { background: var(--primary-red); border-color: var(--primary-red); color: #fff; }
        .prow .pcount { font-size: 0.72rem; font-weight: 500; opacity: 0.7; }
        .section-label {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem; color: var(--charcoal);
            margin-top: 16px;
        }
        .chip {
            flex-shrink: 0;
            padding: 9px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: #fff;
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            white-space: nowrap;
        }
        .chip.active { background: var(--primary-red); border-color: var(--primary-red); color: #fff; }

        /* ── Cards ──────────────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card .photo {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #F1E8D8;
            cursor: pointer;
            overflow: hidden;
        }
        .card .photo img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .card .photo:active { opacity: 0.85; }
        .badge {
            position: absolute;
            top: 8px; left: 8px;
            background: var(--gold);
            color: var(--charcoal);
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 999px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }
        .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; flex: 1; }
        .card .name {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.25;
            min-height: 2.2em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 4px;
        }
        .card .row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .price { font-weight: 700; color: var(--primary-red); font-size: 0.9rem; }
        .price .from { font-size: 0.62rem; font-weight: 500; color: #8a8a8a; }

        .round {
            height: 32px; min-width: 32px;
            border-radius: 999px;
            border: none;
            background: var(--primary-red);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0 10px;
        }
        .round.ghost { background: #EFE6D6; color: var(--text-dark); }
        .stepper { display: flex; align-items: center; gap: 7px; }
        .stepper .qty { font-weight: 700; font-size: 0.9rem; min-width: 14px; text-align: center; }

        /* ── Cart bar ───────────────────────────────────── */
        .cartbar {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
            background: linear-gradient(transparent, var(--cream) 45%);
            pointer-events: none;
            z-index: 30;
        }
        .cartbar button {
            pointer-events: auto;
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--dark-bg);
            color: var(--text-light);
            border: none;
            border-radius: 16px;
            padding: 15px 20px;
            font: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 8px 26px rgba(0,0,0,0.3);
        }
        .cartbar .total { color: var(--gold); font-weight: 700; font-size: 1rem; }

        /* ── Sheet (size picker) ────────────────────────── */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(20,12,8,0.5);
            z-index: 40;
        }
        .sheet {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            max-width: 860px;
            margin: 0 auto;
            background: #fff;
            border-radius: 18px 18px 0 0;
            padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
            z-index: 50;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }
        .sheet h3 { font-family: 'Playfair Display', serif; font-size: 1.05rem; margin-bottom: 14px; }
        .sheet .close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #999; }
        .vrow {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--cream);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
        }
        .vrow .vname { font-weight: 600; font-size: 0.86rem; }
        .vrow .vprice { color: var(--primary-red); font-weight: 700; font-size: 0.86rem; }
        .donebtn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: var(--dark-bg);
            color: var(--gold);
            font: inherit; font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        /* ── Checkout ───────────────────────────────────── */
        .backlink { background:none; border:none; font:inherit; font-size:0.85rem; font-weight:600; color:#8a7a66; cursor:pointer; margin-bottom:14px; }
        h1.page { font-family:'Playfair Display', serif; font-size:1.4rem; margin-bottom:14px; color: var(--charcoal); }
        .panel { background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px; }
        .cline { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; }
        .cline .nm { font-size:0.85rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .cline .amt { font-weight:600; font-size:0.85rem; }
        .ctotal { display:flex; justify-content:space-between; border-top:1px solid var(--border); margin-top:8px; padding-top:10px; font-weight:700; }
        .ctotal .amt { color: var(--primary-red); font-size:1.05rem; }
        .fld { margin-bottom:14px; }
        .fld label { display:block; font-size:0.66rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#8a7a66; margin-bottom:6px; }
        .fld input, .fld textarea {
            width:100%; padding:12px 14px;
            border:1px solid var(--border); border-radius:12px;
            font:inherit; font-size:16px; background:#fff; outline:none; resize:none;
        }
        .fld input:focus, .fld textarea:focus { border-color: var(--gold); }
        .segs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .seg {
            padding:13px; border-radius:12px; border:1px solid var(--border);
            background:#fff; font:inherit; font-size:0.85rem; font-weight:600; cursor:pointer;
        }
        .seg.active { background: var(--primary-red); border-color: var(--primary-red); color:#fff; }
        .seg.gcash.active { background:#1877F2; border-color:#1877F2; }
        .gpsbtn {
            width:100%; margin-top:8px; padding:12px;
            border:1.5px solid var(--primary-red); border-radius:12px;
            background:none; color:var(--primary-red);
            font:inherit; font-size:0.85rem; font-weight:600; cursor:pointer;
        }
        .gpsnote { font-size:0.75rem; color:#2e7d32; margin-top:6px; }
        .gbox { background:var(--cream); border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:10px; }
        .gbox img { display:block; width:160px; height:160px; object-fit:contain; margin:10px auto; background:#fff; border-radius:8px; }
        .err { background:#FDE8E8; border:1px solid #F5C2C2; color:#9B1C1C; border-radius:12px; padding:12px 14px; font-size:0.83rem; margin-bottom:14px; }
        .placebtn {
            width:100%; padding:15px; border:none; border-radius:14px;
            background: var(--primary-red); color:#fff;
            font:inherit; font-size:1rem; font-weight:700; cursor:pointer;
        }
        .placebtn:disabled { opacity:0.55; }

        /* ── Confirmation ───────────────────────────────── */
        .done-wrap { text-align:center; padding:56px 16px; max-width:430px; margin:0 auto; }
        .done-ico { width:64px; height:64px; border-radius:50%; background:#DCF5E3; color:#2e7d32; font-size:1.8rem; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
        .done-wrap h1 { font-family:'Playfair Display', serif; font-size:1.5rem; margin-bottom:8px; }
        .ordno { background:#fff; border:1px solid var(--border); border-radius:16px; padding:18px; margin:18px 0; }
        .ordno .no { font-size:1.8rem; font-weight:700; color:var(--primary-red); }
        .muted { color:#8a7a66; font-size:0.85rem; }

        .loading { display:flex; justify-content:center; padding:70px 0; }
        .spin {
            width:30px; height:30px; border-radius:50%;
            border:3px solid var(--gold); border-top-color:transparent;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty { text-align:center; padding:60px 0; color:#8a7a66; font-size:0.9rem; }
        .foot { text-align:center; padding:20px 0 8px; color:#b0a390; font-size:0.72rem; }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="back">← Back to site</a>
        <a href="index.html" class="brand">Pedro's</a>
        <span style="width:74px"></span>
    </header>

    <div id="scroller"><div class="wrap" id="app">
        <div class="loading"><div class="spin"></div></div>
    </div></div>

    <script>
    (() => {
        // ── Pre-launch gate ──────────────────────────────────────────
        // While LIVE_FOR_EVERYONE is false, the page shows "Coming Soon"
        // unless it was opened once with ?preview=pedros2026 (that device
        // is then remembered as a tester). Set to true to launch.
        const LIVE_FOR_EVERYONE = true;
        const PREVIEW_KEY = "pedros2026";
        const params = new URLSearchParams(location.search);
        if (params.get("preview") === PREVIEW_KEY) {
            localStorage.setItem("pedrosOrderPreview", "1");
        }
        if (!LIVE_FOR_EVERYONE && localStorage.getItem("pedrosOrderPreview") !== "1") {
            document.getElementById("app").innerHTML = `
                <div class="done-wrap">
                    <div class="done-ico" style="background:#F4E4BC;color:#8B4513;">🍳</div>
                    <h1>Online ordering is coming soon!</h1>
                    <p class="muted" style="margin-top:8px">We're putting the finishing touches on it.
                    In the meantime, call us or order through FoodPanda.</p>
                    <a href="index.html" class="placebtn" style="display:inline-block;text-decoration:none;margin-top:22px;max-width:240px">Back to the site</a>
                </div>`;
            return;
        }

        const SB_URL = "https://tgawpkpcfrxobgrsysic.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnYXdwa3BjZnJ4b2JncnN5c2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1ODI5NjQsImV4cCI6MjA2OTE1ODk2NH0.AsNuusVkPzozfCB6QTyLy5cnQUgwmXsjNhNH3hb75Ew";
        const HEADERS = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" };
        const CART_KEY = "pedrosOrderCart";

        const peso = n => "₱" + Number(n).toFixed(2);
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
        const lineKey = c => c.variation ? c.id + "::" + c.variation : c.id;
        const lineLabel = c => c.variation ? c.name + " — " + c.variation : c.name;

        // ── State ────────────────────────────────────────
        let items = [], cats = [], variations = {}, store = {};
        let step = "menu", activeCat = null, search = "", pickerId = null;
        let form = { name:"", phone:"", type:"pickup", address:"", lat:null, lng:null, pay:"cod", ref:"", notes:"", hp:"" };
        window._f = form; // inline oninput handlers run in global scope
        let reviewOpen = false;
        const pageLoadedAt = Date.now(); // bots submit instantly; humans take seconds
        let formError = null, submitting = false, locating = false, doneNumber = null;
        let cart = [];
        try { cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]"); } catch { cart = []; }

        const saveCart = () => localStorage.setItem(CART_KEY, JSON.stringify(cart));
        const cartCount = () => cart.reduce((s,c) => s + c.quantity, 0);
        const cartTotal = () => cart.reduce((s,c) => s + c.price * c.quantity, 0);
        const qtyFor = id => cart.filter(c => c.id === id).reduce((s,c) => s + c.quantity, 0);
        const lineQty = key => cart.find(c => lineKey(c) === key)?.quantity || 0;
        const varsFor = id => variations[id] || [];

        // ── Data ─────────────────────────────────────────
        const get = path => fetch(SB_URL + "/rest/v1/" + path, { headers: HEADERS }).then(r => r.json());

        async function fetchData() {
            const [i, c, v] = await Promise.all([
                get("menu_items?select=*&available=is.true&order=name"),
                get("menu_categories?select=id,name,sort_order&order=sort_order"),
                get("menu_item_variations?select=menu_item_id,id,name,price_adjustment&order=price_adjustment"),
            ]);
            items = Array.isArray(i) ? i : [];
            cats = (Array.isArray(c) ? c : []).filter(cat => items.some(it => it.category_id === cat.id));
            variations = {};
            (Array.isArray(v) ? v : []).forEach(row => {
                (variations[row.menu_item_id] ||= []).push(row);
            });
            // reconcile saved cart with live menu + prices (drops out-of-stock)
            cart = cart.flatMap(cl => {
                const live = items.find(it => it.id === cl.id);
                if (!live) return [];
                if (cl.variation) {
                    const vv = varsFor(cl.id).find(x => x.name === cl.variation);
                    return vv ? [{ ...cl, name: live.name, price: Number(vv.price_adjustment) }] : [];
                }
                return [{ ...cl, name: live.name, price: Number(live.price) }];
            });
            saveCart();
        }

        async function refreshStore() {
            // select=* so this keeps working whether or not the open/close
            // migration columns exist yet
            const s = await get("restaurant_settings?select=*&limit=1");
            store = (Array.isArray(s) && s[0]) || {};
        }

        // ── Store open/close ─────────────────────────────
        // Mirrors the POS + database-trigger rules: manual switch first,
        // then today's weekly-schedule entry, evaluated in Asia/Manila.
        function manilaNow() {
            const d = new Date();
            const day = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
                .indexOf(d.toLocaleDateString("en-US", { timeZone: "Asia/Manila", weekday: "short" }));
            const time = d.toLocaleTimeString("en-GB", { timeZone: "Asia/Manila", hourCycle: "h23", hour: "2-digit", minute: "2-digit" });
            return { day, time };
        }
        function storeIsOpen() {
            if (store.online_ordering_enabled === false) return false;
            const hours = store.store_hours;
            if (!Array.isArray(hours) || hours.length === 0) return true;
            const { day, time } = manilaNow();
            const entry = hours.find(h => h.day === day);
            if (!entry) return true;
            if (entry.closed) return false;
            if (!entry.open || !entry.close) return true;
            if (entry.close < entry.open) return time >= entry.open || time < entry.close; // overnight
            return time >= entry.open && time < entry.close;
        }
        function closedHtml() {
            const msg = store.online_ordering_closed_message
                || "We're currently closed. Please check back during business hours!";
            return `<div class="done-wrap">
                <div class="done-ico" style="background:#F4E4BC;color:#8B4513;">🌙</div>
                <h1>We're closed right now</h1>
                <p class="muted" style="margin-top:8px">${esc(msg)}</p>
                <a href="index.html" class="placebtn" style="display:inline-block;text-decoration:none;margin-top:22px;max-width:240px">Back to the site</a>
            </div>`;
        }

        async function load() {
            await fetchData();
            await refreshStore();
            activeCat = null; // start on the category landing grid
            render();
        }

        // Live sync: availability/price changes made in the POS appear here
        // without a reload. Refresh quietly and only re-render when it's safe
        // (menu view, no sheet open, not mid-typing). Open/close flips always
        // re-render (except on the confirmation screen or mid-submit).
        async function refreshMenu() {
            try {
                const wasOpen = storeIsOpen();
                const before = JSON.stringify(items.map(x => [x.id, x.price, x.name])) + "|" + JSON.stringify(cart);
                await fetchData();
                await refreshStore();
                if (storeIsOpen() !== wasOpen) {
                    if (step !== "done" && !submitting) render();
                    return;
                }
                const after = JSON.stringify(items.map(x => [x.id, x.price, x.name])) + "|" + JSON.stringify(cart);
                if (before === after) return;
                const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
                if (step === "menu" && !pickerId && !catPickerOpen && !typing) render();
            } catch {}
        }
        setInterval(refreshMenu, 30000);
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") refreshMenu();
        });
        // Instant push (sub-second) when the POS flips availability — falls
        // back silently to the 30s poll if realtime isn't reachable.
        window.addEventListener("load", () => {
            try {
                if (!window.supabase?.createClient) return;
                const rtc = window.supabase.createClient(SB_URL, SB_KEY);
                rtc.channel("menu_live")
                    .on("postgres_changes", { event: "*", schema: "public", table: "menu_items" }, () => refreshMenu())
                    .on("postgres_changes", { event: "*", schema: "public", table: "restaurant_settings" }, () => refreshMenu())
                    .subscribe();
            } catch {}
        });

        // ── Cart ops ─────────────────────────────────────
        function addLine(line) {
            const key = lineKey(line);
            const ex = cart.find(c => lineKey(c) === key);
            if (ex) ex.quantity += 1;
            else cart.push({ ...line, quantity: 1 });
            saveCart(); render();
        }
        function decLine(key) {
            cart = cart.map(c => lineKey(c) === key ? { ...c, quantity: c.quantity - 1 } : c).filter(c => c.quantity > 0);
            saveCart(); render();
        }
        window._tap = id => {
            const it = items.find(x => x.id === id);
            if (!it) return;
            if (varsFor(id).length > 0) { pickerId = id; render(); }
            else addLine({ id: it.id, name: it.name, price: Number(it.price) });
        };
        window._dec = key => decLine(key);
        window._addVar = (id, vname) => {
            const it = items.find(x => x.id === id);
            const vv = varsFor(id).find(x => x.name === vname);
            if (it && vv) addLine({ id, name: it.name, price: Number(vv.price_adjustment), variation: vv.name });
        };
        window._decVar = (id, vname) => decLine(id + "::" + vname);
        window._closePicker = () => { pickerId = null; render(); };
        window._cat = id => {
            if (search) search = "";
            activeCat = id;
            render();
            scrollTop();
        };
        window._cats = () => { activeCat = null; search = ""; render(); scrollTop(); };
        let catPickerOpen = false;
        window._openCats = () => { catPickerOpen = true; render(); };
        window._closeCats = () => { catPickerOpen = false; render(); };
        window._pickCat = id => { catPickerOpen = false; window._cat(id); };
        window._search = val => { search = val; renderMenuOnly(); };

        window._go = s => { step = s; formError = null; render(); scrollTop(); };
        window._set = (k, val) => { form[k] = val; render(); };
        window._again = () => { doneNumber = null; step = "menu"; render(); };

        const scrollTop = () => document.getElementById("scroller").scrollTo({ top: 0 });

        // ── GPS ──────────────────────────────────────────
        window._gps = () => {
            formError = null;
            if (!navigator.geolocation) { formError = "Location is not supported by this browser."; render(); return; }
            if (!window.isSecureContext) { formError = "Location needs a secure (https) connection — please type your address."; render(); return; }
            locating = true; render();
            const ok = async pos => {
                form.lat = pos.coords.latitude; form.lng = pos.coords.longitude;
                try {
                    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${form.lat}&lon=${form.lng}&zoom=18`);
                    const d = await r.json();
                    if (d?.display_name) form.address = d.display_name;
                } catch {}
                locating = false; render();
            };
            navigator.geolocation.getCurrentPosition(ok, err => {
                if (err.code === err.PERMISSION_DENIED) {
                    locating = false;
                    formError = "Location permission was denied — allow it in your browser settings, or type your address.";
                    render(); return;
                }
                navigator.geolocation.getCurrentPosition(ok, () => {
                    locating = false;
                    formError = "Couldn't get your location right now — please type your address.";
                    render();
                }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
            }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
        };

        // ── Submit ───────────────────────────────────────
        // ── Input hardening ──────────────────────────────
        const clean = (s, max) => String(s || "")
            .replace(/[\u0000-\u001F\u007F]/g, "")   // strip control chars
            .trim()
            .slice(0, max);

        function sanitizeForm() {
            form.name    = clean(form.name, 60);
            form.address = clean(form.address, 200);
            form.notes   = clean(form.notes, 200);
            form.phone   = String(form.phone || "").replace(/[^0-9+()\-\s]/g, "").trim().slice(0, 20);
            form.ref     = String(form.ref || "").replace(/[^A-Za-z0-9\-]/g, "").slice(0, 40);
        }

        // ── Rate limiting (per browser) ──────────────────
        const RATE_KEY = "pedrosOrderTimes";
        function rateCheck() {
            let times = [];
            try { times = JSON.parse(localStorage.getItem(RATE_KEY) || "[]"); } catch {}
            const tenMinAgo = Date.now() - 10 * 60 * 1000;
            times = times.filter(t => t > tenMinAgo);
            if (times.length >= 5) return "You've placed several orders recently — please wait a few minutes or call us.";
            if (times.length && Date.now() - times[times.length - 1] < 20000) return "Please wait a moment before placing another order.";
            return null;
        }
        function rateRecord() {
            let times = [];
            try { times = JSON.parse(localStorage.getItem(RATE_KEY) || "[]"); } catch {}
            times.push(Date.now());
            localStorage.setItem(RATE_KEY, JSON.stringify(times.slice(-10)));
        }

        // Step 1: validate + sanitize, then show the review sheet
        window._place = () => {
            formError = null;
            sanitizeForm();
            if (!form.name) formError = "Please enter your name.";
            else if (!form.phone || form.phone.replace(/\D/g, "").length < 7) formError = "Please enter a valid phone number.";
            else if (form.type === "delivery" && !form.address) formError = "Please enter your delivery address or use your location.";
            else if (form.pay === "gcash" && !form.ref) formError = "Please enter your GCash reference number after sending payment.";
            else formError = rateCheck();
            if (formError) { render(); return; }
            reviewOpen = true;
            render();
        };
        window._closeReview = () => { reviewOpen = false; render(); };

        // Step 2: confirmed — run spam guards, then submit
        window._confirmPlace = async () => {
            // Honeypot filled or submitted inhumanly fast → pretend success, send nothing
            if (form.hp || Date.now() - pageLoadedAt < 3000) {
                reviewOpen = false;
                doneNumber = "WEB-" + Date.now().toString(36).toUpperCase();
                cart = []; saveCart();
                step = "done"; render(); scrollTop();
                return;
            }

            reviewOpen = false;
            submitting = true; render();

            // Final availability check — something may have sold out while
            // the customer was reviewing
            try {
                const ids = [...new Set(cart.map(c => c.id))].join(",");
                const liveRows = await get(`menu_items?select=id&available=is.true&id=in.(${ids})`);
                const liveIds = new Set((Array.isArray(liveRows) ? liveRows : []).map(x => x.id));
                const stillGood = cart.filter(c => liveIds.has(c.id));
                if (stillGood.length !== cart.length) {
                    const dropped = cart.filter(c => !liveIds.has(c.id)).map(lineLabel).join(", ");
                    cart = stillGood; saveCart();
                    submitting = false;
                    formError = `Sorry — just sold out: ${dropped}. It was removed from your cart; please review and try again.`;
                    render();
                    return;
                }
            } catch {}

            // Store may have closed while the customer was reviewing
            try { await refreshStore(); } catch {}
            if (!storeIsOpen()) { submitting = false; render(); scrollTop(); return; }

            const orderNumber = "WEB-" + Date.now().toString(36).toUpperCase() + Math.floor(Math.random()*36).toString(36).toUpperCase();
            const orderItems = cart.map(c => ({ name: lineLabel(c), quantity: c.quantity, price: c.price }));
            const body = {
                order_number: orderNumber,
                customer_name: form.name,
                customer_phone: form.phone,
                order_text: orderItems.map(x => `${x.quantity}x ${x.name}`).join(", "),
                items: orderItems,
                special_instructions: form.notes || null,
                estimated_total: cartTotal(),
                order_type: form.type,
                delivery_address: form.type === "delivery" ? form.address : null,
                latitude: form.lat, longitude: form.lng,
                payment_method: form.pay,
                payment_reference: form.pay === "gcash" ? form.ref : null,
                status: "pending",
            };
            const res = await fetch(SB_URL + "/rest/v1/online_orders", {
                method: "POST", headers: { ...HEADERS, Prefer: "return=minimal" }, body: JSON.stringify(body),
            });
            submitting = false;
            if (res.ok) {
                rateRecord();
                doneNumber = orderNumber;
                cart = []; saveCart();
                step = "done"; render(); scrollTop();
            } else {
                // The database rejects web orders while the store is closed
                let closedByServer = false;
                try { closedByServer = (await res.text()).includes("ORDERING_CLOSED"); } catch {}
                if (closedByServer) {
                    try { await refreshStore(); } catch {}
                    // Trust the server: if our settings still look open, force closed
                    if (storeIsOpen()) store.online_ordering_enabled = false;
                    render(); scrollTop();
                    return;
                }
                formError = "Something went wrong placing your order. Please try again or call us" + (store.store_phone ? " at " + store.store_phone : "") + ".";
                render();
            }
        };

        // ── Rendering ────────────────────────────────────
        const app = () => document.getElementById("app");

        function cardHtml(it) {
            const vs = varsFor(it.id);
            const hasVars = vs.length > 0;
            const display = hasVars ? Math.min(...vs.map(v => Number(v.price_adjustment))) : Number(it.price);
            const qty = qtyFor(it.id);
            const img = it.image
                ? `<img src="${esc(it.image)}" alt="${esc(it.name)}" loading="lazy" />`
                : "";
            const badge = it.is_best_seller ? `<span class="badge">Best Seller</span>` : "";
            let action;
            if (hasVars) {
                action = qty === 0
                    ? `<button class="round" onclick="_tap('${it.id}')" aria-label="Choose size for ${esc(it.name)}">+</button>`
                    : `<button class="round" onclick="_tap('${it.id}')">${qty} ✎</button>`;
            } else {
                action = qty === 0
                    ? `<button class="round" onclick="_tap('${it.id}')" aria-label="Add ${esc(it.name)}">+</button>`
                    : `<div class="stepper">
                         <button class="round ghost" onclick="_dec('${it.id}')">−</button>
                         <span class="qty">${qty}</span>
                         <button class="round" onclick="_tap('${it.id}')">+</button>
                       </div>`;
            }
            return `<div class="card">
                <div class="photo" role="button" aria-label="Add ${esc(it.name)}" onclick="_tap('${it.id}')">${img}${badge}</div>
                <div class="body">
                    <p class="name" onclick="_tap('${it.id}')">${esc(it.name)}</p>
                    <div class="row">
                        <span class="price">${hasVars ? '<span class="from">from </span>' : ""}${peso(display)}</span>
                        ${action}
                    </div>
                </div>
            </div>`;
        }

        function catTileHtml(cat) {
            const inCat = items.filter(it => it.category_id === cat.id);
            const photo = inCat.find(it => it.image)?.image;
            return `<button class="cat-tile" onclick="_cat('${cat.id}')" aria-label="Browse ${esc(cat.name)}">
                ${photo ? `<img src="${esc(photo)}" alt="" loading="lazy" />` : ""}
                <span class="shade"></span>
                <span class="tlabel">
                    <span class="tname">${esc(cat.name)}</span><br/>
                    <span class="tcount">${inCat.length} dishes</span>
                </span>
            </button>`;
        }

        function menuGridHtml() {
            if (search) {
                const list = items.filter(it => it.name.toLowerCase().includes(search.toLowerCase()));
                if (list.length === 0) return `<div class="empty">No dishes found</div>`;
                return `<div class="grid" style="margin-top:14px">${list.map(cardHtml).join("")}</div>`;
            }
            if (!activeCat) {
                // Category landing — every category as a photo tile
                return `<h2 class="section-label">Our Menu</h2>
                        <div class="cat-grid">${cats.map(catTileHtml).join("")}</div>`;
            }
            const cat = cats.find(c => c.id === activeCat);
            const list = items.filter(it => it.category_id === activeCat);
            return `<div class="cat-head">
                        <button class="cat-back" onclick="_cats()" aria-label="All categories">←</button>
                        <button class="cat-select" onclick="_openCats()" aria-label="Switch category">
                            <span class="cname">${esc(cat ? cat.name : "")}</span>
                            <span class="caret">▼</span>
                        </button>
                    </div>
                    <div class="grid">${list.map(cardHtml).join("")}</div>`;
        }

        function catPickerHtml() {
            if (!catPickerOpen) return "";
            const rows = cats.map(c => {
                const n = items.filter(it => it.category_id === c.id).length;
                return `<button class="prow ${c.id === activeCat ? "current" : ""}" onclick="_pickCat('${c.id}')">
                    <span>${esc(c.name)}</span><span class="pcount">${n} dishes</span>
                </button>`;
            }).join("");
            return `<div class="overlay" onclick="_closeCats()"></div>
                <div class="sheet" style="max-height:75dvh;overflow-y:auto">
                    <button class="close" onclick="_closeCats()">✕</button>
                    <h3>Categories</h3>
                    ${rows}
                </div>`;
        }

        function pickerHtml() {
            if (!pickerId) return "";
            const it = items.find(x => x.id === pickerId);
            if (!it) return "";
            const rows = varsFor(pickerId).map(v => {
                const q = lineQty(pickerId + "::" + v.name);
                const ctrl = q === 0
                    ? `<button class="round" onclick="_addVar('${it.id}','${esc(v.name)}')">+</button>`
                    : `<div class="stepper">
                         <button class="round ghost" onclick="_decVar('${it.id}','${esc(v.name)}')">−</button>
                         <span class="qty">${q}</span>
                         <button class="round" onclick="_addVar('${it.id}','${esc(v.name)}')">+</button>
                       </div>`;
                return `<div class="vrow">
                    <div><div class="vname">${esc(v.name)}</div><div class="vprice">${peso(v.price_adjustment)}</div></div>
                    ${ctrl}
                </div>`;
            }).join("");
            return `<div class="overlay" onclick="_closePicker()"></div>
                <div class="sheet">
                    <button class="close" onclick="_closePicker()">✕</button>
                    <h3>${esc(it.name)}</h3>
                    ${rows}
                    <button class="donebtn" onclick="_closePicker()">Done</button>
                </div>`;
        }

        function menuHtml() {
            return `
                <input class="search" placeholder="Search the menu…" value="${esc(search)}" oninput="_search(this.value)" />

                <div id="menu-grid">${menuGridHtml()}</div>
                <div class="foot">Prices are live from Pedro's POS · Powered by DarcSoft Inc.</div>
                ${pickerHtml()}
                ${catPickerHtml()}
                ${cartCount() > 0 ? `<div class="cartbar"><button onclick="_go('checkout')">
                    <span>🛍 ${cartCount()} item${cartCount() !== 1 ? "s" : ""}</span>
                    <span class="total">Checkout · ${peso(cartTotal())}</span>
                </button></div>` : ""}`;
        }

        function checkoutHtml() {
            const lines = cart.map(c => `
                <div class="cline">
                    <div class="stepper">
                        <button class="round ghost" onclick="_dec('${lineKey(c)}')">−</button>
                        <span class="qty">${c.quantity}</span>
                        <button class="round" onclick="${c.variation ? `_addVar('${c.id}','${esc(c.variation)}')` : `_tap('${c.id}')`}">+</button>
                    </div>
                    <span class="nm">${esc(lineLabel(c))}</span>
                    <span class="amt">${peso(c.price * c.quantity)}</span>
                </div>`).join("");

            const delivery = form.type === "delivery" ? `
                <div class="fld">
                    <label>Delivery Address *</label>
                    <textarea rows="3" maxlength="200" placeholder="House no., street, barangay, city" oninput="_f.address=this.value">${esc(form.address)}</textarea>
                    <button class="gpsbtn" onclick="_gps()">${locating ? "Getting your location…" : "📍 Use my location (GPS)"}</button>
                    ${form.lat ? `<div class="gpsnote">✓ GPS pin saved — our rider will find you exactly</div>` : ""}
                </div>` : "";

            const gcash = form.pay === "gcash" ? `
                <div class="gbox">
                    <div style="font-size:0.85rem">Send <strong>${peso(cartTotal())}</strong> to our GCash${store.gcash_number ? ` number <strong>${esc(store.gcash_number)}</strong>` : ""}, then enter the reference number below.</div>
                    ${store.gcash_qr_code ? `<img src="${esc(store.gcash_qr_code)}" alt="GCash QR" />` : ""}
                    <input placeholder="GCash reference number *" maxlength="40" value="${esc(form.ref)}" oninput="_f.ref=this.value" style="width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:16px;" />
                </div>` : "";

            return `
                <button class="backlink" onclick="_go('menu')">← Back to menu</button>
                <h1 class="page">Checkout</h1>
                <div class="panel">${lines}
                    <div class="ctotal"><span>Total</span><span class="amt">${peso(cartTotal())}</span></div>
                </div>
                <div class="fld"><label>Your Name *</label>
                    <input placeholder="Juan dela Cruz" maxlength="60" value="${esc(form.name)}" oninput="_f.name=this.value" /></div>
                <div class="fld"><label>Phone Number *</label>
                    <input type="tel" placeholder="09XX XXX XXXX" maxlength="20" value="${esc(form.phone)}" oninput="_f.phone=this.value" /></div>
                <div class="fld"><label>Order Type</label>
                    <div class="segs">
                        <button class="seg ${form.type === "pickup" ? "active" : ""}" onclick="_set('type','pickup')">Pick Up</button>
                        <button class="seg ${form.type === "delivery" ? "active" : ""}" onclick="_set('type','delivery')">Delivery</button>
                    </div></div>
                ${delivery}
                <div class="fld"><label>Payment</label>
                    <div class="segs">
                        <button class="seg ${form.pay === "cod" ? "active" : ""}" onclick="_set('pay','cod')">${form.type === "delivery" ? "Cash on Delivery" : "Pay at Pickup"}</button>
                        <button class="seg gcash ${form.pay === "gcash" ? "active" : ""}" onclick="_set('pay','gcash')">GCash</button>
                    </div>
                    ${gcash}</div>
                <div class="fld"><label>Special Instructions</label>
                    <textarea rows="2" maxlength="200" placeholder="Optional — allergies, landmarks, requests…" oninput="_f.notes=this.value">${esc(form.notes)}</textarea></div>
                <div style="position:absolute;left:-5000px;top:-5000px;" aria-hidden="true">
                    <input type="text" name="website_url" tabindex="-1" autocomplete="off" value="${esc(form.hp)}" oninput="_f.hp=this.value" />
                </div>
                ${formError ? `<div class="err">${esc(formError)}</div>` : ""}
                <button class="placebtn" onclick="_place()" ${submitting || cart.length === 0 ? "disabled" : ""}>
                    ${submitting ? "Placing order…" : `Review Order · ${peso(cartTotal())}`}
                </button>
                ${reviewHtml()}`;
        }

        function reviewHtml() {
            if (!reviewOpen) return "";
            const lines = cart.map(c => `
                <div class="cline">
                    <span class="nm"><strong>${c.quantity}×</strong> ${esc(lineLabel(c))}</span>
                    <span class="amt">${peso(c.price * c.quantity)}</span>
                </div>`).join("");
            return `<div class="overlay" onclick="_closeReview()"></div>
                <div class="sheet" style="max-height:85dvh;overflow-y:auto">
                    <button class="close" onclick="_closeReview()">✕</button>
                    <h3>Confirm your order</h3>
                    <div class="panel" style="margin-bottom:12px">${lines}
                        <div class="ctotal"><span>Total</span><span class="amt">${peso(cartTotal())}</span></div>
                    </div>
                    <div class="panel" style="margin-bottom:14px;font-size:0.85rem;line-height:1.7">
                        <div><strong>${esc(form.name)}</strong> · ${esc(form.phone)}</div>
                        <div>${form.type === "delivery" ? "🛵 Delivery — " + esc(form.address) : "🛍 Pick up at the restaurant"}</div>
                        <div>${form.pay === "gcash" ? "GCash · Ref " + esc(form.ref) : (form.type === "delivery" ? "Cash on Delivery" : "Pay at Pickup")}</div>
                        ${form.notes ? `<div style="color:#8a7a66">"${esc(form.notes)}"</div>` : ""}
                    </div>
                    <button class="placebtn" onclick="_confirmPlace()">Confirm & Place Order</button>
                    <button class="donebtn" style="margin-top:8px;background:#fff;color:var(--text-dark);border:1px solid var(--border)" onclick="_closeReview()">Go Back & Edit</button>
                </div>`;
        }

        function doneHtml() {
            return `<div class="done-wrap">
                <div class="done-ico">✓</div>
                <h1>Order received!</h1>
                <p class="muted">We'll start preparing it as soon as our staff confirms.</p>
                <div class="ordno">
                    <div class="muted" style="text-transform:uppercase;letter-spacing:0.08em;font-size:0.66rem;font-weight:700">Your order number</div>
                    <div class="no">${esc(doneNumber)}</div>
                </div>
                <p class="muted">Keep this number — mention it when you ${form.type === "delivery" ? "receive your delivery" : "pick up your order"}.${store.store_phone ? ` Questions? Call us at <a href="tel:${esc(store.store_phone)}" style="color:var(--primary-red);font-weight:600">${esc(store.store_phone)}</a>.` : ""}</p>
                <button class="placebtn" style="margin-top:18px" onclick="_again()">Order Again</button>
            </div>`;
        }

        function render() {
            if (step === "done" && doneNumber) app().innerHTML = doneHtml();
            else if (!storeIsOpen()) app().innerHTML = closedHtml();
            else if (step === "checkout") app().innerHTML = checkoutHtml();
            else app().innerHTML = menuHtml();
        }
        function renderMenuOnly() {
            // keep focus in the search box: only refresh the grid
            const grid = document.getElementById("menu-grid");
            if (grid) grid.innerHTML = menuGridHtml();
        }

        load().catch(() => {
            app().innerHTML = `<div class="empty">Couldn't load the menu right now. Please try again in a moment.</div>`;
        });
    })();
    </script>
</body>
</html>
